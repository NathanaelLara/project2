<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión - TalentoLocal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    
    .container {
      max-width: 500px;
    }
    
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }
    
    h1 {
      font-size: 32px;
      margin-bottom: 12px;
      font-weight: 800;
    }
    
    p {
      font-size: 18px;
      opacity: 0.9;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .btn {
      display: inline-block;
      background: white;
      color: #0f172a;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
    }
    
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.05);
        opacity: 0.8;
      }
    }
    
    .status {
      margin-top: 40px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 14px;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Sin conexión a Internet</h1>
    <p>Parece que no tienes conexión a Internet. Por favor verifica tu conexión y vuelve a intentar.</p>
    <a href="/" class="btn" onclick="location.reload(); return false;">Reintentar</a>
    
    <div class="status" id="status">
      Verificando conexión...
    </div>
  </div>
  
  <script>
    function checkConnection() {
      const statusEl = document.getElementById('status');
      
      if (navigator.onLine) {
        statusEl.innerHTML = '✓ Conexión detectada. <a href="/" style="color: #6ee7b7; text-decoration: underline;">Volver al sitio</a>';
      } else {
        statusEl.textContent = '✗ Sin conexión a Internet';
      }
    }
    
    checkConnection();
    
    window.addEventListener('online', checkConnection);
    window.addEventListener('offline', checkConnection);
    
    setInterval(checkConnection, 3000);
  </script>
</body>
</html>
